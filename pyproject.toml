[project]
name = "concourse"
dynamic = ["version"]
description = "Multi-platform schedule aggregation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "playwright==1.64.1",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "icalendar>=6.0.0,<8",
    "pydantic-settings>=2.5.0",
    "apscheduler>=3.10.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
desktop = ["pyinstaller==6.22.3"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
concourse = "concourse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.hatch.version]
path = "shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["concourse", "backend", "shared", "fetchers"]
